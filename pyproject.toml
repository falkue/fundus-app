[project]
name = "fundus"
version = "0.2.0"
description = "Central evidence archive: figures, time series, forecasts, studies, quotes and practices with sources"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "numpy>=1.26", "sqlite-vec>=0.1.6", "pillow>=10", "pillow-heif>=1.0", "rawpy>=0.20", "duckdb>=1.2", "pytz>=2024.1", "openpyxl>=3.1", "pynacl>=1.5", "argon2-cffi>=23.1"]  # pytz: DuckDB hands TIMESTAMPTZ values to Python only with it

[project.optional-dependencies]
# fundus render: slides HTML -> PNG on every platform (then: python -m playwright install chromium-headless-shell)
render = ["playwright>=1.49"]

[project.scripts]
fundus = "fundus.cli:main"

[tool.setuptools]
packages = ["fundus", "importers"]

[tool.setuptools.package-data]
fundus = ["schema.sql", "cloud_words_de.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
