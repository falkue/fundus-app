<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand__logo" aria-hidden="true"></span>
      <span class="brand__text">
        <span class="brand__title">Fundus</span>
        <span class="brand__sub" id="brand-sub">Evidenzarchiv auf dem Spark</span>
      </span>
      <button type="button" class="sidebar__toggle" id="sidebar-hide" title="Seitenleiste ausblenden (Strg/⌘ + \)" aria-label="Seitenleiste ausblenden" aria-controls="sidebar"><svg class="nav__icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-sidebar"/></svg></button>
    </div>
    <nav id="nav" aria-label="Bereiche"></nav>
    <div class="sidebar__spacer"></div>
    <div class="sidebar__foot">
      <div class="row row--between">
        <div class="theme-toggle" role="group" aria-label="Erscheinungsbild" id="theme-toggle">
          <button type="button" data-theme="auto" aria-pressed="true">Auto</button>
          <button type="button" data-theme="light" aria-pressed="false">Hell</button>
          <button type="button" data-theme="dark" aria-pressed="false">Dunkel</button>
        </div>
      </div>
      <div class="sidebar__status" id="sidebar-status"><span class="status-dot status-dot--unknown" aria-hidden="true"></span><span>Verbinde mit Fundus…</span></div>
    </div>
  </aside>
  <div class="sidebar__resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-controls="sidebar" aria-label="Breite der Seitenleiste" tabindex="0" title="Ziehen: Breite ändern · Doppelklick: Standardbreite"></div>
  <button type="button" class="sidebar__show" id="sidebar-show" title="Seitenleiste einblenden (Strg/⌘ + \)" aria-label="Seitenleiste einblenden" aria-controls="sidebar" hidden><svg class="nav__icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-sidebar"/></svg></button>
  <main class="main">
    <div class="main__inner" id="view" aria-live="polite">
      <div class="skeleton" aria-hidden="true"><div class="skeleton__bar"></div><div class="skeleton__bar"></div><div class="skeleton__bar"></div></div>
    </div>
  </main>
</div>

<div class="tooltip" id="tooltip" role="tooltip" data-show="false"></div>
<div class="toast" id="toast" role="status" data-show="false"></div>
